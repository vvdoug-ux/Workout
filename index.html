<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workout Tracker</title>
    <!-- We load Chart.js to handle the visual progress graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background: #f4f4f9; 
            color: #333; 
        }
        
        /* Top Navigation Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
            height: 42px;
        }
        
        .tab-btn {
            flex: 1;
            height: 100%;
            padding: 0 6px;
            background: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .tab-btn:hover { background: #cbd5e1; }
        .tab-btn.active { background: #2563eb; color: white; }

        .settings-tab-btn {
            flex: none;
            width: 42px;
            font-size: 1.1em;
            padding: 0;
        }

        /* Section Visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
        }
        h2, h3 { margin-top: 0; color: #1a1a1a; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        
        input, select, button { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }

        /* Equipment Tag Selector in Log Section */
        .equip-select-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .equip-btn {
            flex: 1;
            padding: 8px 10px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            margin-top: 0;
        }
        .equip-btn:hover { background: #e2e8f0; }
        .equip-btn.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        /* Favorite Star Button */
        .star-btn {
            background: transparent;
            color: #cbd5e1;
            border: none;
            padding: 6px;
            border-radius: 4px;
            font-size: 1.2em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 0;
            width: auto;
            font-weight: bold;
            transition: color 0.2s;
        }
        .star-btn:hover { color: #94a3b8; }
        .star-btn.active {
            background: transparent;
            color: #eab308;
        }
        .star-btn.active:hover { color: #ca8a04; }

        /* Filter Row Styles for Favorites Section */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .filter-btn {
            flex: 1;
            padding: 8px 6px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            margin-top: 0;
        }
        .filter-btn:hover { background: #e2e8f0; }
        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .filter-btn.sub-btn {
            font-size: 0.8em;
            padding: 6px 4px;
        }
        .filter-btn.day-btn {
            font-size: 0.8em;
            padding: 6px 2px;
        }

        /* Favorites Quick Selection Section */
        .favorites-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .fav-btn {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            width: auto;
            margin-top: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .fav-btn:hover { background: #e2e8f0; border-color: #94a3b8; }
        
        .fav-btn.logged {
            opacity: 0.45;
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        /* Settings Modal Overlay & Context Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            max-width: 550px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .modal-header h2 { margin: 0; }
        .close-modal-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            width: auto;
            margin: 0;
            padding: 0 5px;
        }

        .add-exercise-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .setting-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fafafa;
        }
        .setting-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .category-chip {
            font-size: 0.8em;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background: white;
            cursor: pointer;
            user-select: none;
            color: #475569;
            transition: all 0.15s ease;
        }
        
        .category-chip.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .category-chip.disabled-chip {
            cursor: not-allowed;
            opacity: 0.75;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 0;
            width: auto;
            font-weight: bold;
        }
        .delete-btn:hover { background: #dc2626; }
        .delete-btn.disabled-btn {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .delete-btn.disabled-btn:hover { background: #cbd5e1; }

        /* Day Selection Toggle Buttons in Quick Menu Modal */
        .day-toggle-btn {
            flex: 1;
            padding: 10px 0;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            margin-top: 0;
            transition: all 0.15s;
        }
        .day-toggle-btn.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
        canvas { max-width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div class="top-header">
        <button class="tab-btn active" onclick="switchTab('log')">Log Exercise</button>
        <button class="tab-btn" onclick="switchTab('tracker')">Progress</button>
        <button class="tab-btn" onclick="switchTab('history')">History</button>
        <button class="tab-btn settings-tab-btn" onclick="openSettings()" title="Settings">⚙️</button>
    </div>

    <!-- Log Exercise Section -->
    <div id="section-log" class="tab-content active">
        <div class="card">
            <form id="workout-form">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Exercise Name</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" id="exercise" list="exercise-history" placeholder="Type or select an exercise..." autocomplete="off" onfocus="this.select()" required>
                        <button type="button" id="star-btn" class="star-btn" onclick="toggleFavoriteFromForm()" title="Favorite Exercise">★</button>
                    </div>
                    <datalist id="exercise-history"></datalist>
                </div>

                <!-- Unlabeled Equipment Tag Buttons -->
                <div class="equip-select-group">
                    <button type="button" class="equip-btn" data-equip="Bodyweight" onclick="setFormEquipment('Bodyweight')">Bodyweight</button>
                    <button type="button" class="equip-btn" data-equip="Barbell" onclick="setFormEquipment('Barbell')">Barbell</button>
                    <button type="button" class="equip-btn" data-equip="Dumbbells" onclick="setFormEquipment('Dumbbells')">Dumbbells</button>
                </div>

                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Weight</label>
                        <input type="number" id="weight" step="0.5" onfocus="this.select()" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Sets</label>
                        <input type="number" id="sets" onfocus="this.select()" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Reps</label>
                        <input type="number" id="reps" onfocus="this.select()" required>
                    </div>
                </div>
                <button type="submit">Save</button>
            </form>
        </div>

        <!-- Favorites Quick Select Card -->
        <div class="card">
            <!-- Row 1: View Filter Buttons -->
            <div class="filter-row">
                <button type="button" class="filter-btn active" id="btn-view-favorites" onclick="setViewFilter('favorites')">Favorites Only</button>
                <button type="button" class="filter-btn" id="btn-view-all" onclick="setViewFilter('all')">Show All</button>
            </div>
            <!-- Row 2: Split / Focus Filter Buttons -->
            <div class="filter-row" style="gap: 4px;">
                <button type="button" class="filter-btn sub-btn" id="btn-cat-leg" onclick="setCategoryFilter('Leg Day')">Leg Day</button>
                <button type="button" class="filter-btn sub-btn" id="btn-cat-arm" onclick="setCategoryFilter('Arm Day')">Arm Day</button>
                <button type="button" class="filter-btn sub-btn" id="btn-cat-core" onclick="setCategoryFilter('Core')">Core</button>
                <button type="button" class="filter-btn sub-btn" id="btn-cat-push" onclick="setCategoryFilter('Push')">Push</button>
                <button type="button" class="filter-btn sub-btn" id="btn-cat-pull" onclick="setCategoryFilter('Pull')">Pull</button>
            </div>
            <!-- Row 3: Day of Week Filter Buttons -->
            <div class="filter-row" style="gap: 4px; margin-bottom: 22px;">
                <button type="button" class="filter-btn day-btn" id="btn-day-Su" onclick="setDayFilter('Su')">Su</button>
                <button type="button" class="filter-btn day-btn" id="btn-day-M" onclick="setDayFilter('M')">M</button>
                <button type="button" class="filter-btn day-btn" id="btn-day-Tu" onclick="setDayFilter('Tu')">Tu</button>
                <button type="button" class="filter-btn day-btn" id="btn-day-W" onclick="setDayFilter('W')">W</button>
                <button type="button" class="filter-btn day-btn" id="btn-day-Th" onclick="setDayFilter('Th')">Th</button>
                <button type="button" class="filter-btn day-btn" id="btn-day-F" onclick="setDayFilter('F')">F</button>
                <button type="button" class="filter-btn day-btn" id="btn-day-Sa" onclick="setDayFilter('Sa')">Sa</button>
            </div>
            <div id="favorites-list"></div>
        </div>
    </div>

    <!-- Chart Visualization Tab -->
    <div id="section-tracker" class="card tab-content">
        <h2>Progress Tracker</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
            <div style="flex: 1; min-width: 160px;">
                <label for="chart-filter">Exercise</label>
                <select id="chart-filter">
                    <option value="">-- No Data Yet --</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 160px;">
                <label for="chart-timeframe">Timeframe</label>
                <select id="chart-timeframe">
                    <option value="week">Week</option>
                    <option value="month">Month</option>
                    <option value="year" selected>Year</option>
                    <option value="max">Max</option>
                </select>
            </div>
        </div>
        <canvas id="progressChart"></canvas>
    </div>

    <!-- History Table Tab -->
    <div id="section-history" class="card tab-content">
        <h2>History</h2>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Exercise</th>
                    <th>Weight</th>
                    <th>Sets</th>
                    <th>Reps</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Exercise Settings</h2>
                <button class="close-modal-btn" onclick="closeSettings()">&times;</button>
            </div>

            <!-- Add New Exercise Input Form -->
            <div class="add-exercise-box">
                <label style="font-weight: bold; font-size: 0.9em; margin-bottom: 6px; display: block;">Add New Exercise</label>
                <form id="add-exercise-form" onsubmit="addNewExerciseFromSettings(event)" style="display: flex; gap: 8px;">
                    <input type="text" id="new-exercise-input" placeholder="Enter exercise name..." style="flex: 1;" required>
                    <button type="submit" style="width: auto; margin-top: 0; padding: 0 16px; font-size: 0.9em; white-space: nowrap;">+ Add</button>
                </form>
            </div>

            <div id="settings-exercise-list"></div>
        </div>
    </div>

    <!-- Quick Long-Press Day Schedule Modal -->
    <div id="day-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 380px;">
            <div class="modal-header">
                <h3 id="day-modal-title" style="margin: 0; font-size: 1.1em;">Assign Days</h3>
                <button class="close-modal-btn" onclick="closeDayModal()">&times;</button>
            </div>
            <p style="font-size: 0.85em; color: #64748b; margin-top: 0; margin-bottom: 14px;">Select days of the week for this exercise:</p>
            <div style="display: flex; gap: 4px; margin-bottom: 18px;" id="day-modal-buttons">
                <!-- Su, M, Tu, W, Th, F, Sa buttons populated dynamically -->
            </div>
            <button type="button" onclick="closeDayModal()" style="margin-top: 0;">Done</button>
        </div>
    </div>

    <script>
        function getPacificDateString() {
            return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
        }

        function getCutoffDateString(timeframe) {
            if (timeframe === 'max') return null;
            const d = new Date();
            if (timeframe === 'week') d.setDate(d.getDate() - 7);
            else if (timeframe === 'month') d.setMonth(d.getMonth() - 1);
            else if (timeframe === 'year') d.setFullYear(d.getFullYear() - 1);
            return d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
        }

        // Available Days of Week
        const DAYS_OF_WEEK = ["Su", "M", "Tu", "W", "Th", "F", "Sa"];

        // List of exercises explicitly removed by user request
        const PURGED_EXERCISES = [
            "Tricep Extensions", "Side Plank", "Side Crunches", "Romanian Deadlifts", 
            "Reverse Plank", "Hanging Leg Raises", "Floor Leg Raises", "Dips",
            "Dips (narrow)", "Dips (wide)", "Crunches (side)", "Plank (side)", 
            "Plank (reverse)", "Leg Raises (floor)", "Leg Raises (hanging)", "Deadlifts (romanian)"
        ];

        // Available Group Options (Upper Body and Lower Body removed)
        const MUSCLE_GROUPS = [
            "Arms", "Back", "Chest", "Core", "Legs", 
            "Pull", "Push", "Shoulders"
        ].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

        const MUSCLES_GENERAL = [
            "Abs", "Biceps", "Calves", "Deltoids", "Forearms", 
            "Glutes", "Hamstrings", "Lats", "Lower Back", 
            "Obliques", "Pecs", "Quads", "Rhomboids", 
            "Traps", "Triceps"
        ].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

        // Pre-populated default locked exercises definitions (Purged items removed)
        const PRESET_EXERCISES = {
            "Push-ups": { defaultEquipment: "Bodyweight", muscleGroups: ["Chest", "Push"], musclesGeneral: ["Pecs"], isLocked: true },
            "Pull-ups": { defaultEquipment: "Bodyweight", muscleGroups: ["Pull", "Back"], musclesGeneral: ["Lats"], isLocked: true },
            "Bench Press": { defaultEquipment: "Barbell", muscleGroups: ["Chest", "Push"], musclesGeneral: ["Pecs"], isLocked: true },
            "Overhead Press": { defaultEquipment: "Dumbbells", muscleGroups: ["Shoulders", "Push"], musclesGeneral: ["Deltoids"], isLocked: true },
            "Bicep Curls": { defaultEquipment: "Dumbbells", muscleGroups: ["Arms", "Pull"], musclesGeneral: ["Biceps"], isLocked: true },
            "Skull Crushers": { defaultEquipment: "Dumbbells", muscleGroups: ["Arms", "Push"], musclesGeneral: ["Triceps"], isLocked: true },
            "Squats": { defaultEquipment: "Bodyweight", muscleGroups: ["Push", "Legs"], musclesGeneral: ["Quads"], isLocked: true },
            "Lateral Raises": { defaultEquipment: "Dumbbells", muscleGroups: ["Shoulders", "Arms", "Pull", "Push"], musclesGeneral: ["Deltoids"], isLocked: true },
            "Arm Circles": { defaultEquipment: "Bodyweight", muscleGroups: ["Shoulders", "Arms"], musclesGeneral: ["Deltoids"], isLocked: true },
            "Reverse Fly": { defaultEquipment: "Dumbbells", muscleGroups: ["Pull", "Shoulders"], musclesGeneral: ["Deltoids"], isLocked: true },
            "Batwing Rows": { defaultEquipment: "Dumbbells", muscleGroups: ["Pull", "Back"], musclesGeneral: ["Rhomboids", "Traps"], isLocked: true },
            "Shrugs": { defaultEquipment: "Barbell", muscleGroups: ["Pull", "Back"], musclesGeneral: ["Traps"], isLocked: true },
            "Farmer Carries": { defaultEquipment: "Dumbbells", muscleGroups: ["Arms"], musclesGeneral: ["Forearms"], isLocked: true },
            "Upright Rows": { defaultEquipment: "Dumbbells", muscleGroups: ["Back", "Pull"], musclesGeneral: ["Traps"], isLocked: true },
            "Pullover": { defaultEquipment: "Dumbbells", muscleGroups: ["Back", "Pull"], musclesGeneral: ["Lats"], isLocked: true },
            "Crunches": { defaultEquipment: "Bodyweight", muscleGroups: ["Core"], musclesGeneral: ["Abs"], isLocked: true },
            "Crunches (bicycle)": { defaultEquipment: "Bodyweight", muscleGroups: ["Core"], musclesGeneral: ["Obliques"], isLocked: true },
            "Plank": { defaultEquipment: "Bodyweight", muscleGroups: ["Core"], musclesGeneral: ["Abs"], isLocked: true },
            "Superman": { defaultEquipment: "Bodyweight", muscleGroups: ["Core"], musclesGeneral: ["Lower Back"], isLocked: true },
            "Glute Bridge": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs"], musclesGeneral: ["Glutes"], isLocked: true },
            "Lunges": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs", "Push"], musclesGeneral: ["Quads"], isLocked: true },
            "Calf Raises": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs", "Push"], musclesGeneral: ["Calves"], isLocked: true },
            "Nordic Hamstring Curls": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs", "Pull"], musclesGeneral: ["Hamstrings"], isLocked: true },
            "Floor Press": { defaultEquipment: "Dumbbells", muscleGroups: ["Chest", "Push"], musclesGeneral: ["Pecs"], isLocked: true },
            "Bird Dogs": { defaultEquipment: "Bodyweight", muscleGroups: ["Core"], musclesGeneral: ["Lower Back"], isLocked: true },
            "Russian Twists": { defaultEquipment: "Dumbbells", muscleGroups: ["Core"], musclesGeneral: ["Obliques"], isLocked: true },
            "Arnold Press": { defaultEquipment: "Dumbbells", muscleGroups: ["Shoulders", "Push"], musclesGeneral: ["Deltoids"], isLocked: true },
            "Tricep Kickbacks": { defaultEquipment: "Dumbbells", muscleGroups: ["Arms", "Push"], musclesGeneral: ["Triceps"], isLocked: true },
            "Wrist Curls": { defaultEquipment: "Dumbbells", muscleGroups: ["Arms", "Pull"], musclesGeneral: ["Forearms"], isLocked: true },
            "Wrist Extensions": { defaultEquipment: "Dumbbells", muscleGroups: ["Arms", "Pull"], musclesGeneral: ["Forearms"], isLocked: true },
            "Inverted Row": { defaultEquipment: "Bodyweight", muscleGroups: ["Back", "Pull"], musclesGeneral: ["Lats"], isLocked: true },
            "Chest Fly": { defaultEquipment: "Dumbbells", muscleGroups: ["Chest", "Push"], musclesGeneral: ["Pecs"], isLocked: true },
            "Flutter Kicks": { defaultEquipment: "Bodyweight", muscleGroups: ["Core"], musclesGeneral: ["Abs"], isLocked: true },
            "Deadlifts": { defaultEquipment: "Barbell", muscleGroups: ["Legs", "Pull"], musclesGeneral: ["Glutes"], isLocked: true },
            "Deadlifts (sumo)": { defaultEquipment: "Barbell", muscleGroups: ["Legs", "Pull"], musclesGeneral: ["Quads"], isLocked: true },
            "Donkey Kicks": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs", "Push"], musclesGeneral: ["Glutes"], isLocked: true },
            "Squats (bulgarian split)": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs", "Push"], musclesGeneral: ["Quads"], isLocked: true },
            "Wall Sit": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs"], musclesGeneral: ["Quads"], isLocked: true },
            "Tuck Jumps": { defaultEquipment: "Bodyweight", muscleGroups: ["Legs", "Push"], musclesGeneral: ["Quads"], isLocked: true }
        };

        // Load existing data from browser storage
        let workouts = JSON.parse(localStorage.getItem('workouts')) || [];
        let exerciseMeta = JSON.parse(localStorage.getItem('exerciseMeta')) || {};
        let renamedPresets = JSON.parse(localStorage.getItem('renamedPresets')) || {};
        let deletedPresets = JSON.parse(localStorage.getItem('deletedPresets')) || [];

        // Purge requested exercises from storage completely
        function purgeRemovedExercises() {
            PURGED_EXERCISES.forEach(pEx => {
                if (!deletedPresets.some(d => d.toLowerCase() === pEx.toLowerCase())) {
                    deletedPresets.push(pEx);
                }
                Object.keys(exerciseMeta).forEach(k => {
                    if (k.toLowerCase() === pEx.toLowerCase()) {
                        delete exerciseMeta[k];
                    }
                });
            });
            localStorage.setItem('deletedPresets', JSON.stringify(deletedPresets));
            saveMeta();
        }

        // Favorites / List Filter States
        let activeViewFilter = 'favorites'; // 'favorites' or 'all'
        let activeCategoryFilter = null;   // null, 'Leg Day', 'Arm Day', 'Core', 'Push', 'Pull'
        let activeDayFilter = null;        // null, 'Su', 'M', 'Tu', 'W', 'Th', 'F', 'Sa'

        function normalizeArray(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data;
            if (typeof data === 'object') return Object.keys(data).filter(k => data[k]);
            return [];
        }

        // Initialize preset metadata, maintaining locked tags & names
        function initPresetMetadata() {
            purgeRemovedExercises();

            Object.keys(PRESET_EXERCISES).forEach(exName => {
                if (deletedPresets.some(d => d.toLowerCase() === exName.toLowerCase())) {
                    return;
                }

                let targetName = exName;
                while (renamedPresets[targetName]) {
                    targetName = renamedPresets[targetName];
                }

                const preset = PRESET_EXERCISES[exName];
                const existingKey = Object.keys(exerciseMeta).find(k => k.toLowerCase() === targetName.toLowerCase());
                
                if (existingKey) {
                    exerciseMeta[existingKey].isLocked = true;
                    if (!exerciseMeta[existingKey].defaultEquipment) {
                        exerciseMeta[existingKey].defaultEquipment = preset.defaultEquipment;
                    }
                    if (!exerciseMeta[existingKey].muscleGroups || exerciseMeta[existingKey].muscleGroups.length === 0) {
                        exerciseMeta[existingKey].muscleGroups = [...preset.muscleGroups];
                    }
                    if (!exerciseMeta[existingKey].musclesGeneral || exerciseMeta[existingKey].musclesGeneral.length === 0) {
                        exerciseMeta[existingKey].musclesGeneral = [...preset.musclesGeneral];
                    }
                    if (!exerciseMeta[existingKey].days) {
                        exerciseMeta[existingKey].days = [];
                    }
                } else {
                    exerciseMeta[targetName] = {
                        favorite: false,
                        defaultEquipment: preset.defaultEquipment,
                        muscleGroups: [...preset.muscleGroups],
                        musclesGeneral: [...preset.musclesGeneral],
                        days: [],
                        isLocked: true
                    };
                }
            });
            saveMeta();
        }

        initPresetMetadata();

        workouts = workouts.map(w => w.id ? w : { ...w, id: Date.now() + Math.random() });
        localStorage.setItem('workouts', JSON.stringify(workouts));

        let chartInstance = null;
        let selectedFormEquipment = "Bodyweight";
        let activeDayModalExercise = null;

        const form = document.getElementById('workout-form');
        const filter = document.getElementById('chart-filter');
        const timeframeFilter = document.getElementById('chart-timeframe');
        const datalist = document.getElementById('exercise-history');
        const exerciseInput = document.getElementById('exercise');
        const weightInput = document.getElementById('weight');
        const starBtn = document.getElementById('star-btn');

        document.getElementById('date').value = getPacificDateString();

        function setFormEquipment(equipTag) {
            selectedFormEquipment = equipTag || "Bodyweight";
            
            document.querySelectorAll('.equip-btn').forEach(btn => {
                if (btn.dataset.equip === selectedFormEquipment) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            updateWeightFieldState();
        }

        function resetLogForm() {
            form.reset();
            document.getElementById('date').value = getPacificDateString();
            setFormEquipment("Bodyweight");
            updateStarButton();
        }

        function getMeta(exName) {
            if (!exName) return { favorite: false, defaultEquipment: "Bodyweight", muscleGroups: [], musclesGeneral: [], days: [], isLocked: false };
            const key = Object.keys(exerciseMeta).find(k => k.toLowerCase() === exName.toLowerCase());
            if (key) {
                const m = exerciseMeta[key];
                return {
                    favorite: !!m.favorite,
                    defaultEquipment: m.defaultEquipment || "Bodyweight",
                    muscleGroups: normalizeArray(m.muscleGroups),
                    musclesGeneral: normalizeArray(m.musclesGeneral || m.muscles),
                    days: normalizeArray(m.days),
                    isLocked: !!m.isLocked || !!PRESET_EXERCISES[key]
                };
            }
            return { favorite: false, defaultEquipment: "Bodyweight", muscleGroups: [], musclesGeneral: [], days: [], isLocked: false };
        }

        function ensureMeta(exName) {
            if (!exName) return null;
            const key = Object.keys(exerciseMeta).find(k => k.toLowerCase() === exName.toLowerCase());
            if (key) {
                exerciseMeta[key].muscleGroups = normalizeArray(exerciseMeta[key].muscleGroups);
                exerciseMeta[key].musclesGeneral = normalizeArray(exerciseMeta[key].musclesGeneral || exerciseMeta[key].muscles);
                exerciseMeta[key].days = normalizeArray(exerciseMeta[key].days);
                if (!exerciseMeta[key].defaultEquipment) exerciseMeta[key].defaultEquipment = "Bodyweight";
                return exerciseMeta[key];
            }
            exerciseMeta[exName] = { favorite: false, defaultEquipment: "Bodyweight", muscleGroups: [], musclesGeneral: [], days: [], isLocked: false };
            saveMeta();
            return exerciseMeta[exName];
        }

        function saveMeta() {
            localStorage.setItem('exerciseMeta', JSON.stringify(exerciseMeta));
        }

        function switchTab(tabName) {
            if (tabName !== 'log') {
                resetLogForm();
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.top-header .tab-btn:not(.settings-tab-btn)').forEach(el => el.classList.remove('active'));

            const buttons = document.querySelectorAll('.top-header .tab-btn');

            if (tabName === 'log') {
                document.getElementById('section-log').classList.add('active');
                buttons[0].classList.add('active');
            } else if (tabName === 'tracker') {
                document.getElementById('section-tracker').classList.add('active');
                buttons[1].classList.add('active');
                updateChart();
            } else if (tabName === 'history') {
                document.getElementById('section-history').classList.add('active');
                buttons[2].classList.add('active');
            }
        }

        function autofillExerciseData(exName) {
            if (!exName) return;
            const matching = workouts.filter(w => w.exercise.toLowerCase() === exName.toLowerCase());
            
            if (matching.length > 0) {
                const newest = matching.sort((a, b) => (b.id || 0) - (a.id || 0))[0];
                if (newest) {
                    weightInput.value = newest.weight;
                    document.getElementById('sets').value = newest.sets ? newest.sets : '';
                    document.getElementById('reps').value = newest.reps;
                    setFormEquipment(newest.equipment || getMeta(exName).defaultEquipment);
                    return;
                }
            }

            const meta = getMeta(exName);
            setFormEquipment(meta.defaultEquipment);
        }

        function updateWeightFieldState() {
            if (selectedFormEquipment === "Bodyweight") {
                weightInput.disabled = true;
                weightInput.value = '0';
                weightInput.required = false;
                weightInput.style.backgroundColor = '#e2e8f0';
                weightInput.style.color = '#94a3b8';
                weightInput.style.cursor = 'not-allowed';
            } else {
                weightInput.disabled = false;
                weightInput.required = true;
                weightInput.style.backgroundColor = '';
                weightInput.style.color = '';
                weightInput.style.cursor = '';
            }
        }

        function updateStarButton() {
            const val = exerciseInput.value.trim();
            starBtn.textContent = '★';

            if (!val) {
                starBtn.classList.remove('active');
                return;
            }

            const meta = getMeta(val);
            if (meta.favorite) {
                starBtn.classList.add('active');
            } else {
                starBtn.classList.remove('active');
            }
        }

        function toggleFavoriteFromForm() {
            const val = exerciseInput.value.trim();
            if (!val) return;
            
            const meta = ensureMeta(val);
            meta.favorite = !meta.favorite;
            saveMeta();
            updateStarButton();
            updateUI();
        }

        exerciseInput.addEventListener('input', () => {
            const val = exerciseInput.value.trim();
            if (val) {
                autofillExerciseData(val);
            } else {
                weightInput.value = '';
                document.getElementById('sets').value = '';
                document.getElementById('reps').value = '';
                setFormEquipment("Bodyweight");
            }
            updateStarButton();
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const exercise = exerciseInput.value.trim();
            const weight = weightInput.disabled ? 0 : (parseFloat(weightInput.value) || 0);
            const sets = parseInt(document.getElementById('sets').value);
            const reps = parseInt(document.getElementById('reps').value);

            ensureMeta(exercise);

            const newEntry = { 
                id: Date.now(), 
                date, 
                exercise, 
                equipment: selectedFormEquipment, 
                weight, 
                sets, 
                reps 
            };

            workouts.push(newEntry);
            localStorage.setItem('workouts', JSON.stringify(workouts));
            
            updateUI();
            resetLogForm();
        });

        filter.addEventListener('change', updateChart);
        timeframeFilter.addEventListener('change', updateChart);

        function deleteEntry(id) {
            if (confirm("Are you sure you want to delete this set?")) {
                workouts = workouts.filter(w => w.id !== id);
                localStorage.setItem('workouts', JSON.stringify(workouts));
                updateUI();
            }
        }

        function selectFavorite(exName) {
            exerciseInput.value = exName;
            autofillExerciseData(exName);
            updateStarButton();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* --- Filter Controls Logic --- */
        function setViewFilter(mode) {
            activeViewFilter = mode;
            updateFilterButtons();
            updateFavoritesList();
        }

        function setCategoryFilter(cat) {
            if (activeCategoryFilter === cat) {
                activeCategoryFilter = null; // Deselect if clicked again
            } else {
                activeCategoryFilter = cat;
            }
            updateFilterButtons();
            updateFavoritesList();
        }

        function setDayFilter(day) {
            if (activeDayFilter === day) {
                activeDayFilter = null; // Single select toggle
            } else {
                activeDayFilter = day;
            }
            updateFilterButtons();
            updateFavoritesList();
        }

        function updateFilterButtons() {
            const btnFav = document.getElementById('btn-view-favorites');
            const btnAll = document.getElementById('btn-view-all');

            if (btnFav && btnAll) {
                if (activeViewFilter === 'favorites') {
                    btnFav.classList.add('active');
                    btnAll.classList.remove('active');
                } else {
                    btnFav.classList.remove('active');
                    btnAll.classList.add('active');
                }
            }

            const catMap = {
                'Leg Day': 'btn-cat-leg',
                'Arm Day': 'btn-cat-arm',
                'Core': 'btn-cat-core',
                'Push': 'btn-cat-push',
                'Pull': 'btn-cat-pull'
            };

            Object.keys(catMap).forEach(catKey => {
                const btn = document.getElementById(catMap[catKey]);
                if (btn) {
                    if (activeCategoryFilter === catKey) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });

            DAYS_OF_WEEK.forEach(dayStr => {
                const btn = document.getElementById(`btn-day-${dayStr}`);
                if (btn) {
                    if (activeDayFilter === dayStr) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });
        }

        function updateFavoritesList() {
            const container = document.getElementById('favorites-list');
            container.innerHTML = '';
            
            let exercises = [...new Set([
                ...workouts.map(w => w.exercise),
                ...Object.keys(exerciseMeta)
            ])].filter(ex => !PURGED_EXERCISES.some(p => p.toLowerCase() === ex.toLowerCase()));

            // Filter Row 1: Favorites vs Show All
            if (activeViewFilter === 'favorites') {
                exercises = exercises.filter(ex => getMeta(ex).favorite);
            }

            // Filter Row 2: Workout Focus / Split Filter
            if (activeCategoryFilter) {
                exercises = exercises.filter(ex => {
                    const meta = getMeta(ex);
                    const groups = meta.muscleGroups || [];
                    if (activeCategoryFilter === 'Leg Day') {
                        return groups.includes('Legs');
                    } else if (activeCategoryFilter === 'Arm Day') {
                        return groups.some(mg => ['Arms', 'Chest', 'Back', 'Shoulders'].includes(mg));
                    } else if (activeCategoryFilter === 'Core') {
                        return groups.includes('Core');
                    } else if (activeCategoryFilter === 'Push') {
                        return groups.includes('Push');
                    } else if (activeCategoryFilter === 'Pull') {
                        return groups.includes('Pull');
                    }
                    return true;
                });
            }

            // Filter Row 3: Day of Week Filter
            if (activeDayFilter) {
                exercises = exercises.filter(ex => {
                    const meta = getMeta(ex);
                    const days = meta.days || [];
                    return days.includes(activeDayFilter);
                });
            }

            if (exercises.length === 0) {
                container.innerHTML = '<p style="color: #64748b; font-size: 0.9em; margin: 0;">No exercises match the selected filters.</p>';
                return;
            }

            const todayStr = getPacificDateString();

            if (activeCategoryFilter) {
                const categorized = {};
                MUSCLES_GENERAL.forEach(m => categorized[m] = []);
                categorized["Uncategorized"] = [];

                exercises.forEach(ex => {
                    const meta = getMeta(ex);
                    const genMuscles = (meta.musclesGeneral || []).filter(m => MUSCLES_GENERAL.includes(m));

                    if (genMuscles.length > 0) {
                        [...new Set(genMuscles)].forEach(m => {
                            categorized[m].push(ex);
                        });
                    } else {
                        categorized["Uncategorized"].push(ex);
                    }
                });

                renderCategoryGroups(container, categorized, [...MUSCLES_GENERAL, "Uncategorized"], todayStr);
            } else {
                const displayGroups = MUSCLE_GROUPS.filter(mg => mg !== "Push" && mg !== "Pull");
                const categorized = {};
                displayGroups.forEach(mg => categorized[mg] = []);
                categorized["Uncategorized"] = [];

                exercises.forEach(ex => {
                    const meta = getMeta(ex);
                    const activeGroups = (meta.muscleGroups || []).filter(mg => displayGroups.includes(mg));

                    if (activeGroups.length > 0) {
                        [...new Set(activeGroups)].forEach(mg => {
                            categorized[mg].push(ex);
                        });
                    } else {
                        categorized["Uncategorized"].push(ex);
                    }
                });

                renderCategoryGroups(container, categorized, [...displayGroups, "Uncategorized"], todayStr);
            }
        }

        /* Attach Long-Press Event Listeners to Exercise Buttons */
        function attachLongPress(btn, exName) {
            let timer = null;
            let isLongPress = false;

            const start = () => {
                isLongPress = false;
                timer = setTimeout(() => {
                    isLongPress = true;
                    openDayModal(exName);
                }, 450); // 450ms long press threshold
            };

            const cancel = () => {
                if (timer) {
                    clearTimeout(timer);
                    timer = null;
                }
            };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('touchstart', start, { passive: true });

            btn.addEventListener('mouseup', cancel);
            btn.addEventListener('mouseleave', cancel);
            btn.addEventListener('touchend', cancel);
            btn.addEventListener('touchcancel', cancel);

            btn.onclick = (e) => {
                if (isLongPress) {
                    e.preventDefault();
                    e.stopPropagation();
                    isLongPress = false;
                    return;
                }
                selectFavorite(exName);
            };
        }

        function renderCategoryGroups(container, categorizedMap, categoryKeys, todayStr) {
            categoryKeys.forEach(catKey => {
                const exercisesInCat = categorizedMap[catKey];
                if (exercisesInCat && exercisesInCat.length > 0) {
                    exercisesInCat.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
                    const uniqueEx = [...new Set(exercisesInCat)];

                    const groupDiv = document.createElement('div');
                    groupDiv.style.marginBottom = '14px';

                    const catHeader = document.createElement('div');
                    catHeader.textContent = catKey;
                    catHeader.style.fontSize = '0.8em';
                    catHeader.style.fontWeight = 'bold';
                    catHeader.style.color = '#64748b';
                    catHeader.style.textTransform = 'uppercase';
                    catHeader.style.letterSpacing = '0.5px';
                    catHeader.style.marginBottom = '6px';

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'favorites-grid';

                    uniqueEx.forEach(ex => {
                        const btn = document.createElement('button');
                        btn.className = 'fav-btn';
                        btn.type = 'button';
                        btn.textContent = ex;

                        const isLoggedToday = workouts.some(w => 
                            w.exercise.toLowerCase() === ex.toLowerCase() && w.date === todayStr
                        );

                        if (isLoggedToday) {
                            btn.classList.add('logged');
                            btn.title = 'Already logged today (Long-press to assign days)';
                        } else {
                            btn.title = 'Long-press to assign days';
                        }

                        attachLongPress(btn, ex);
                        gridDiv.appendChild(btn);
                    });

                    groupDiv.appendChild(catHeader);
                    groupDiv.appendChild(gridDiv);
                    container.appendChild(groupDiv);
                }
            });
        }

        /* --- Quick Long-Press Day Schedule Modal Logic --- */
        function openDayModal(exName) {
            activeDayModalExercise = exName;
            document.getElementById('day-modal-title').textContent = `Assign Days: ${exName}`;
            renderDayModalButtons();
            document.getElementById('day-modal').classList.add('active');
        }

        function closeDayModal() {
            document.getElementById('day-modal').classList.remove('active');
            activeDayModalExercise = null;
            updateFavoritesList();
        }

        function renderDayModalButtons() {
            const container = document.getElementById('day-modal-buttons');
            container.innerHTML = '';
            if (!activeDayModalExercise) return;

            const meta = ensureMeta(activeDayModalExercise);
            const assignedDays = meta.days || [];

            DAYS_OF_WEEK.forEach(dayStr => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'day-toggle-btn' + (assignedDays.includes(dayStr) ? ' selected' : '');
                btn.textContent = dayStr;

                btn.onclick = () => {
                    const currentMeta = ensureMeta(activeDayModalExercise);
                    if (currentMeta.days.includes(dayStr)) {
                        currentMeta.days = currentMeta.days.filter(d => d !== dayStr);
                    } else {
                        currentMeta.days.push(dayStr);
                    }
                    saveMeta();
                    renderDayModalButtons();
                };

                container.appendChild(btn);
            });
        }

        function updateUI() {
            updateTable();
            updateExerciseLists();
            updateFilterButtons();
            updateFavoritesList();
            updateChart();
        }

        function updateTable() {
            const tbody = document.querySelector('#history-table tbody');
            tbody.innerHTML = '';
            
            const sorted = [...workouts].sort((a, b) => (b.id || 0) - (a.id || 0));
            
            sorted.forEach(w => {
                const tr = document.createElement('tr');
                const displaySets = w.sets ? w.sets : '-';
                
                tr.innerHTML = `
                    <td>${w.date}</td>
                    <td>${w.exercise}</td>
                    <td>${w.weight}</td>
                    <td>${displaySets}</td>
                    <td>${w.reps}</td>
                    <td><button class="delete-btn" onclick="deleteEntry(${w.id})">X</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateExerciseLists() {
            const exercises = [...new Set([
                ...workouts.map(w => w.exercise),
                ...Object.keys(exerciseMeta)
            ])].filter(ex => !PURGED_EXERCISES.some(p => p.toLowerCase() === ex.toLowerCase()))
              .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
            
            const currentSelection = filter.value;
            filter.innerHTML = '<option value="">-- Select Exercise --</option>';
            datalist.innerHTML = '';

            if (exercises.length === 0) return;

            exercises.forEach(ex => {
                const option = document.createElement('option');
                option.value = ex;
                option.textContent = ex;
                if (ex === currentSelection) option.selected = true;
                filter.appendChild(option);

                const dataOption = document.createElement('option');
                dataOption.value = ex;
                datalist.appendChild(dataOption);
            });

            if (!filter.value && exercises.length > 0) {
                filter.value = exercises[0];
            }
        }

        function updateChart() {
            const selectedEx = filter.value;
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            if (!selectedEx || workouts.length === 0) return;

            let data = workouts.filter(w => w.exercise === selectedEx);

            if (data.length === 0) return;

            const selectedTimeframe = timeframeFilter.value;
            const cutoffDate = getCutoffDateString(selectedTimeframe);

            if (cutoffDate) {
                data = data.filter(w => w.date >= cutoffDate);
            }

            if (data.length === 0) return;

            const meta = getMeta(selectedEx);

            const dateTotals = {};
            data.forEach(w => {
                const isBodyweight = (w.equipment ? w.equipment === "Bodyweight" : meta.defaultEquipment === "Bodyweight");
                const numSets = w.sets ? w.sets : 1;
                const volume = isBodyweight ? (numSets * w.reps) : (w.weight * numSets * w.reps);
                
                if (dateTotals[w.date]) {
                    dateTotals[w.date] += volume;
                } else {
                    dateTotals[w.date] = volume;
                }
            });

            const dates = Object.keys(dateTotals).sort((a, b) => new Date(a) - new Date(b));
            const totalVolumes = dates.map(d => dateTotals[d]);

            const latestLogEquip = data[data.length - 1].equipment || meta.defaultEquipment;
            const isBodyweightChart = (latestLogEquip === "Bodyweight");
            const yAxisLabel = isBodyweightChart ? 'Total Volume' : 'Total Weight';

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [{
                        data: totalVolumes,
                        backgroundColor: 'rgba(37, 99, 235, 0.75)',
                        borderColor: '#2563eb',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return isBodyweightChart 
                                        ? `Total Volume: ${context.parsed.y} reps` 
                                        : `Total Weight: ${context.parsed.y} lbs/kg`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: { 
                            beginAtZero: true,
                            title: { display: true, text: yAxisLabel },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        /* --- Settings Modal Logic --- */
        function openSettings() {
            resetLogForm();
            renderSettingsList();
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function addNewExerciseFromSettings(e) {
            e.preventDefault();
            const input = document.getElementById('new-exercise-input');
            const exName = input.value.trim();

            if (exName) {
                ensureMeta(exName);
                input.value = '';
                updateUI();
                renderSettingsList();
            }
        }

        function renderBinaryCategoryChips(container, optionsList, activeList, isLocked, onToggle) {
            optionsList.forEach(itemOpt => {
                const chip = document.createElement('div');
                const isSelected = activeList.includes(itemOpt);

                chip.className = 'category-chip' + (isSelected ? ' selected' : '') + (isLocked ? ' disabled-chip' : '');
                chip.textContent = itemOpt;

                if (!isLocked) {
                    chip.onclick = () => {
                        onToggle(itemOpt, isSelected);
                    };
                }

                container.appendChild(chip);
            });
        }

        function renderSettingsList() {
            const container = document.getElementById('settings-exercise-list');
            container.innerHTML = '';

            const allExercises = [...new Set([
                ...workouts.map(w => w.exercise),
                ...Object.keys(exerciseMeta)
            ])].filter(ex => !PURGED_EXERCISES.some(p => p.toLowerCase() === ex.toLowerCase()))
              .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

            if (allExercises.length === 0) {
                container.innerHTML = '<p style="color: #64748b;">No exercises added yet.</p>';
                return;
            }

            allExercises.forEach(ex => {
                const meta = ensureMeta(ex);
                const isLocked = meta.isLocked || !!PRESET_EXERCISES[ex];

                const item = document.createElement('div');
                item.className = 'setting-item';

                const topRow = document.createElement('div');
                topRow.className = 'setting-row';

                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = ex;
                nameInput.style.flex = '1';
                
                if (isLocked) {
                    nameInput.disabled = true;
                    nameInput.style.backgroundColor = '#f1f5f9';
                    nameInput.style.color = '#64748b';
                    nameInput.style.cursor = 'not-allowed';
                } else {
                    nameInput.onfocus = function() { this.select(); };
                    nameInput.onchange = () => {
                        const newName = nameInput.value.trim();
                        if (newName && newName !== ex) {
                            renameExercise(ex, newName);
                        }
                    };
                }

                const favBtn = document.createElement('button');
                favBtn.className = 'star-btn' + (meta.favorite ? ' active' : '');
                favBtn.textContent = '★';
                favBtn.type = 'button';
                favBtn.onclick = () => {
                    meta.favorite = !meta.favorite;
                    saveMeta();
                    renderSettingsList();
                    updateFavoritesList();
                    updateStarButton();
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn' + (isLocked ? ' disabled-btn' : '');
                deleteBtn.textContent = 'X';
                deleteBtn.type = 'button';
                deleteBtn.title = isLocked ? 'Default exercises cannot be deleted' : 'Delete Exercise';
                
                if (!isLocked) {
                    deleteBtn.onclick = () => {
                        if (confirm(`Are you sure you want to delete "${ex}" and all its history?`)) {
                            deleteExercise(ex);
                        }
                    };
                }

                topRow.appendChild(nameInput);
                topRow.appendChild(favBtn);
                topRow.appendChild(deleteBtn);
                item.appendChild(topRow);

                // 1. Groups Selection Chips (Renamed from Muscle Groups)
                const mgLabel = document.createElement('label');
                mgLabel.textContent = 'Groups:';
                mgLabel.style.marginTop = '6px';

                const mgChipsDiv = document.createElement('div');
                mgChipsDiv.className = 'category-chips';

                renderBinaryCategoryChips(mgChipsDiv, MUSCLE_GROUPS, meta.muscleGroups, isLocked, (itemOpt, isSelected) => {
                    if (isSelected) {
                        meta.muscleGroups = meta.muscleGroups.filter(m => m !== itemOpt);
                    } else {
                        meta.muscleGroups.push(itemOpt);
                    }
                    saveMeta();
                    renderSettingsList();
                    updateFavoritesList();
                });

                item.appendChild(mgLabel);
                item.appendChild(mgChipsDiv);

                // 2. Muscles Selection Chips (Renamed from Muscles general)
                const mgGenLabel = document.createElement('label');
                mgGenLabel.textContent = 'Muscles:';
                mgGenLabel.style.marginTop = '10px';

                const mgGenChipsDiv = document.createElement('div');
                mgGenChipsDiv.className = 'category-chips';

                renderBinaryCategoryChips(mgGenChipsDiv, MUSCLES_GENERAL, meta.musclesGeneral, isLocked, (itemOpt, isSelected) => {
                    if (isSelected) {
                        meta.musclesGeneral = meta.musclesGeneral.filter(m => m !== itemOpt);
                    } else {
                        meta.musclesGeneral.push(itemOpt);
                    }
                    saveMeta();
                    renderSettingsList();
                    updateFavoritesList();
                });

                item.appendChild(mgGenLabel);
                item.appendChild(mgGenChipsDiv);

                container.appendChild(item);
            });
        }

        function renameExercise(oldName, newName) {
            if (!oldName || !newName || oldName.trim().toLowerCase() === newName.trim().toLowerCase()) return;
            oldName = oldName.trim();
            newName = newName.trim();

            workouts.forEach(w => {
                if (w.exercise && w.exercise.toLowerCase() === oldName.toLowerCase()) {
                    w.exercise = newName;
                }
            });
            localStorage.setItem('workouts', JSON.stringify(workouts));

            const oldKey = Object.keys(exerciseMeta).find(k => k.toLowerCase() === oldName.toLowerCase());
            if (oldKey) {
                exerciseMeta[newName] = { ...exerciseMeta[oldKey] };
            } else {
                exerciseMeta[newName] = { favorite: false, defaultEquipment: "Bodyweight", muscleGroups: [], musclesGeneral: [], days: [], isLocked: false };
            }

            Object.keys(exerciseMeta).forEach(k => {
                if (k.toLowerCase() === oldName.toLowerCase() && k !== newName) {
                    delete exerciseMeta[k];
                }
            });

            renamedPresets[oldName] = newName;
            localStorage.setItem('renamedPresets', JSON.stringify(renamedPresets));

            saveMeta();
            updateUI();
            if (document.getElementById('settings-modal').classList.contains('active')) {
                renderSettingsList();
            }
        }

        function deleteExercise(exName) {
            if (!exName) return;
            exName = exName.trim();

            workouts = workouts.filter(w => w.exercise.toLowerCase() !== exName.toLowerCase());
            localStorage.setItem('workouts', JSON.stringify(workouts));

            Object.keys(exerciseMeta).forEach(k => {
                if (k.toLowerCase() === exName.toLowerCase()) {
                    delete exerciseMeta[k];
                }
            });

            if (!deletedPresets.some(d => d.toLowerCase() === exName.toLowerCase())) {
                deletedPresets.push(exName);
                localStorage.setItem('deletedPresets', JSON.stringify(deletedPresets));
            }

            saveMeta();
            updateUI();
            if (document.getElementById('settings-modal').classList.contains('active')) {
                renderSettingsList();
            }
        }

        // Initialize app on page load
        updateUI();
    </script>
</body>
</html>
