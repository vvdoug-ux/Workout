<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker SPA</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
      --input-bg: #2b2b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1, h2, h3 {
      margin: 0 0 12px 0;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 4px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    /* Card Layouts */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Form Elements */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, button {
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    /* Checkbox & Tag Options */
    .tag-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag-option {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--input-bg);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .tag-option input {
      cursor: pointer;
    }

    /* Buttons */
    .btn-primary {
      background-color: var(--accent);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: white;
    }

    .hidden {
      display: none !important;
    }

    /* Badges */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      background: #374151;
      padding: 3px 8px;
      border-radius: 12px;
      margin-right: 4px;
      margin-top: 4px;
    }

    .badge-tag {
      background: #1e3a8a;
      color: #93c5fd;
    }

    /* History & Lists */
    .log-item {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .exercise-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--input-bg);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* Chart Canvas */
    .chart-container {
      position: relative;
      width: 100%;
      height: 300px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('log-tab')">Log</button>
    <button class="tab-btn" onclick="switchTab('charts-tab')">Progress</button>
    <button class="tab-btn" onclick="switchTab('history-tab')">History</button>
    <button class="tab-btn" onclick="switchTab('settings-tab')">Manage</button>
  </nav>

  <!-- TAB 1: LOG WORKOUT -->
  <div id="log-tab" class="tab-content card active">
    <h2>Log Exercise</h2>
    <form id="workout-form">
      <!-- Select or Type Exercise -->
      <div class="form-group">
        <label for="exercise-select">Select Exercise</label>
        <select id="exercise-select">
          <option value="">-- Choose Existing or Type Below --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="exercise-name">Exercise Name</label>
        <input type="text" id="exercise-name" placeholder="e.g. Bench Press, Pull Up" required>
      </div>

      <!-- Tags Section -->
      <div class="form-group">
        <label>Tags</label>
        <div class="tag-group">
          <label class="tag-option"><input type="checkbox" name="tags" value="Bodyweight"> Bodyweight</label>
          <label class="tag-option"><input type="checkbox" name="tags" value="Push"> Push</label>
          <label class="tag-option"><input type="checkbox" name="tags" value="Pull"> Pull</label>
        </div>
      </div>

      <!-- Groups Section (Replaces Categories) -->
      <div class="form-group">
        <label for="group-select">Groups</label>
        <select id="group-select" required>
          <option value="">-- Select Group --</option>
          <option value="Arms">Arms</option>
          <option value="Legs">Legs</option>
          <option value="Upper Back">Upper Back</option>
          <option value="Chest">Chest</option>
          <option value="Shoulders">Shoulders</option>
          <option value="Core">Core</option>
        </select>
      </div>

      <!-- Dynamic Subcategory Dropdown -->
      <div class="form-group hidden" id="subcategory-container">
        <label id="subcategory-label" for="subcategory-select">Subcategory</label>
        <select id="subcategory-select">
          <option value="">-- Select Option --</option>
        </select>
      </div>

      <!-- Dynamic Sub-Subcategory Dropdown -->
      <div class="form-group hidden" id="sub-subcategory-container">
        <label id="sub-subcategory-label" for="sub-subcategory-select">Sub-Subcategory</label>
        <select id="sub-subcategory-select">
          <option value="">-- Select Option --</option>
        </select>
      </div>

      <!-- Weight, Sets, Reps -->
      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label for="weight">Weight (lbs)</label>
          <input type="number" id="weight" min="0" step="0.5" placeholder="0">
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="sets">Sets</label>
          <input type="number" id="sets" min="1" placeholder="3" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="reps">Reps</label>
          <input type="number" id="reps" min="1" placeholder="10" required>
        </div>
      </div>

      <button type="submit" class="btn-primary">Save Workout Log</button>
    </form>
  </div>

  <!-- TAB 2: PROGRESS CHARTS -->
  <div id="charts-tab" class="tab-content card">
    <h2>Volume Progression</h2>
    <div class="form-group">
      <label for="chart-filter">Filter by Exercise</label>
      <select id="chart-filter">
        <option value="ALL">All Exercises (Total Volume)</option>
      </select>
    </div>
    <div class="chart-container">
      <canvas id="volumeChart"></canvas>
    </div>
  </div>

  <!-- TAB 3: HISTORY -->
  <div id="history-tab" class="tab-content card">
    <h2>Workout History (PST)</h2>
    <div id="log-list">No workouts logged yet.</div>
  </div>

  <!-- TAB 4: MANAGE EXERCISES -->
  <div id="settings-tab" class="tab-content card">
    <h2>Manage Exercises</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted);">Toggle favorites or remove custom presets.</p>
    <div id="exercise-manage-list"></div>
  </div>
</div>

<script>
  // Dynamic Multi-Tier Taxonomy Data Structure
  const taxonomyData = {
    "Arms": {
      label: "Arm Muscles",
      options: ["Biceps", "Triceps", "Brachialis", "Forearms"]
    },
    "Legs": {
      label: "Leg Muscles",
      options: ["Quads", "Hamstrings", "Adductors", "Gluteus Maximus", "Calves"]
    },
    "Upper Back": {
      label: "Upper Back Muscles",
      options: ["Lats", "Traps", "Rhomboids"]
    },
    "Chest": {
      label: "Chest Muscles",
      options: {
        "Pectoralis Major": {
          label: "Pectoralis Major Sections",
          options: ["Upper", "Middle", "Lower"]
        },
        "Pectoralis Minor": null,
        "Serratus Anterior": null
      }
    },
    "Shoulders": {
      label: "Shoulder Muscles",
      options: ["Anterior Deltoid (front)", "Lateral Deltoid (side)", "Posterior Deltoid (rear)"]
    },
    "Core": {
      label: "Core Muscles",
      options: {
        "Lower Back": {
          label: "Lower Back Muscles",
          options: ["Erector Spinae", "Multifidus", "Quadratus Lumborum"]
        },
        "Glutes": {
          label: "Glute Muscles",
          options: ["Gluteus Medius", "Gluteus Minimus"]
        },
        "Abs": {
          label: "Ab Muscles",
          options: ["Rectus Abdominus", "Transversus Abdominus", "Internal Obliques", "External Obliques"]
        }
      }
    }
  };

  // State Management
  let logs = JSON.parse(localStorage.getItem('workout_logs') || '[]');
  let exercises = JSON.parse(localStorage.getItem('workout_exercises') || '[]');
  let chartInstance = null;

  // Initialize Default Presets if Empty
  if (exercises.length === 0) {
    exercises = [
      { name: "Bench Press", group: "Chest", sub: "Pectoralis Major", subSub: "Middle", tags: ["Push"], favorite: true },
      { name: "Pull Up", group: "Upper Back", sub: "Lats", subSub: null, tags: ["Bodyweight", "Pull"], favorite: true },
      { name: "Squat", group: "Legs", sub: "Quads", subSub: null, tags: ["Push"], favorite: false }
    ];
    localStorage.setItem('workout_exercises', JSON.stringify(exercises));
  }

  // DOM Handles
  const groupSelect = document.getElementById('group-select');
  const subContainer = document.getElementById('subcategory-container');
  const subLabel = document.getElementById('subcategory-label');
  const subSelect = document.getElementById('subcategory-select');

  const subSubContainer = document.getElementById('sub-subcategory-container');
  const subSubLabel = document.getElementById('sub-subcategory-label');
  const subSubSelect = document.getElementById('sub-subcategory-select');

  const exerciseSelect = document.getElementById('exercise-select');
  const exerciseNameInput = document.getElementById('exercise-name');
  const workoutForm = document.getElementById('workout-form');

  // Tab Navigation
  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(tabId));
    if (activeBtn) activeBtn.classList.add('active');
    
    document.getElementById(tabId).classList.add('active');

    if (tabId === 'charts-tab') updateChart();
    if (tabId === 'history-tab') renderHistory();
    if (tabId === 'settings-tab') renderExerciseManager();
  }

  // Handle Dynamic Subcategory Selection
  groupSelect.addEventListener('change', (e) => {
    const selectedGroup = e.target.value;

    subSelect.innerHTML = '<option value="">-- Select Option --</option>';
    subSubSelect.innerHTML = '<option value="">-- Select Option --</option>';
    subSubContainer.classList.add('hidden');

    if (!selectedGroup || !taxonomyData[selectedGroup]) {
      subContainer.classList.add('hidden');
      return;
    }

    const groupConfig = taxonomyData[selectedGroup];
    subLabel.textContent = groupConfig.label;

    const items = Array.isArray(groupConfig.options) 
      ? groupConfig.options 
      : Object.keys(groupConfig.options);

    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      subSelect.appendChild(opt);
    });

    subContainer.classList.remove('hidden');
  });

  // Handle Dynamic Sub-Subcategory Selection
  subSelect.addEventListener('change', (e) => {
    const selectedGroup = groupSelect.value;
    const selectedSub = e.target.value;

    subSubSelect.innerHTML = '<option value="">-- Select Option --</option>';

    if (!selectedGroup || !selectedSub || !taxonomyData[selectedGroup]) {
      subSubContainer.classList.add('hidden');
      return;
    }

    const groupConfig = taxonomyData[selectedGroup];

    if (groupConfig.options && !Array.isArray(groupConfig.options) && groupConfig.options[selectedSub]) {
      const subConfig = groupConfig.options[selectedSub];
      subSubLabel.textContent = subConfig.label;

      subConfig.options.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        subSubSelect.appendChild(opt);
      });

      subSubContainer.classList.remove('hidden');
    } else {
      subSubContainer.classList.add('hidden');
    }
  });

  // Exercise Select Dropdown Autofill
  function populateExerciseDropdown() {
    exerciseSelect.innerHTML = '<option value="">-- Choose Existing or Type Below --</option>';
    
    // Sort Favorites first
    const sorted = [...exercises].sort((a, b) => b.favorite - a.favorite);

    sorted.forEach(ex => {
      const opt = document.createElement('option');
      opt.value = ex.name;
      opt.textContent = `${ex.favorite ? '★ ' : ''}${ex.name}`;
      exerciseSelect.appendChild(opt);
    });
  }

  exerciseSelect.addEventListener('change', (e) => {
    const found = exercises.find(ex => ex.name === e.target.value);
    if (found) {
      exerciseNameInput.value = found.name;
      
      // Auto-set tags
      document.querySelectorAll('input[name="tags"]').forEach(cb => {
        cb.checked = found.tags ? found.tags.includes(cb.value) : false;
      });

      // Auto-set group & dynamic subcategories
      if (found.group) {
        groupSelect.value = found.group;
        groupSelect.dispatchEvent(new Event('change'));

        if (found.sub) {
          subSelect.value = found.sub;
          subSelect.dispatchEvent(new Event('change'));

          if (found.subSub) {
            subSubSelect.value = found.subSub;
          }
        }
      }

      // Auto-fill previous weight/sets/reps from last log
      const lastLog = logs.find(l => l.exercise.toLowerCase() === found.name.toLowerCase());
      if (lastLog) {
        document.getElementById('weight').value = lastLog.weight;
        document.getElementById('sets').value = lastLog.sets;
        document.getElementById('reps').value = lastLog.reps;
      }
    }
  });

  // Form Submission
  workoutForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const name = exerciseNameInput.value.trim();
    const tags = Array.from(document.querySelectorAll('input[name="tags"]:checked')).map(cb => cb.value);
    const group = groupSelect.value;
    const sub = subSelect.value || null;
    const subSub = subSubSelect.value || null;
    const weight = parseFloat(document.getElementById('weight').value) || 0;
    const sets = parseInt(document.getElementById('sets').value);
    const reps = parseInt(document.getElementById('reps').value);

    // Save or Update Exercise Preset
    let exObj = exercises.find(ex => ex.name.toLowerCase() === name.toLowerCase());
    if (!exObj) {
      exObj = { name, group, sub, subSub, tags, favorite: false };
      exercises.push(exObj);
    } else {
      exObj.group = group;
      exObj.sub = sub;
      exObj.subSub = subSub;
      exObj.tags = tags;
    }
    localStorage.setItem('workout_exercises', JSON.stringify(exercises));

    // Add Log Entry
    const newLog = {
      id: Date.now(),
      exercise: name,
      tags,
      group,
      sub,
      subSub,
      weight,
      sets,
      reps,
      volume: weight * sets * reps,
      timestamp: new Date().toISOString()
    };

    logs.unshift(newLog);
    localStorage.setItem('workout_logs', JSON.stringify(logs));

    // Reset Form
    workoutForm.reset();
    subContainer.classList.add('hidden');
    subSubContainer.classList.add('hidden');
    populateExerciseDropdown();
    alert('Workout Logged Successfully!');
  });

  // Render History in PST
  function renderHistory() {
    const list = document.getElementById('log-list');
    if (logs.length === 0) {
      list.innerHTML = 'No workouts logged yet.';
      return;
    }

    list.innerHTML = logs.map(log => {
      // Format PST Time
      const dateStr = new Date(log.timestamp).toLocaleString('en-US', {
        timeZone: 'America/Los_Angeles',
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });

      return `
        <div class="log-item">
          <div class="log-info">
            <strong>${log.exercise}</strong>
            <div>
              <span class="badge">${log.group}</span>
              ${log.sub ? `<span class="badge">${log.sub}</span>` : ''}
              ${log.subSub ? `<span class="badge">${log.subSub}</span>` : ''}
              ${log.tags ? log.tags.map(t => `<span class="badge badge-tag">${t}</span>`).join('') : ''}
            </div>
            <small style="color: var(--text-muted); margin-top: 4px;">
              ${log.weight > 0 ? log.weight + ' lbs | ' : ''}${log.sets} sets × ${log.reps} reps 
              (${log.volume > 0 ? log.volume + ' lbs total' : 'Bodyweight'})
            </small>
            <small style="color: #6b7280; font-size: 0.75rem;">${dateStr} PST</small>
          </div>
          <button class="btn-danger" onclick="deleteLog(${log.id})">Delete</button>
        </div>
      `;
    }).join('');
  }

  function deleteLog(id) {
    if (confirm('Delete this log entry?')) {
      logs = logs.filter(l => l.id !== id);
      localStorage.setItem('workout_logs', JSON.stringify(logs));
      renderHistory();
    }
  }

  // Manage Exercises & Favorites
  function renderExerciseManager() {
    const container = document.getElementById('exercise-manage-list');
    if (exercises.length === 0) {
      container.innerHTML = 'No stored exercise presets.';
      return;
    }

    container.innerHTML = exercises.map((ex, index) => `
      <div class="exercise-list-item">
        <div>
          <strong>${ex.name}</strong>
          <br>
          <small style="color: var(--text-muted);">${ex.group} ${ex.sub ? '• ' + ex.sub : ''}</small>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="fav-btn" onclick="toggleFav(${index})">${ex.favorite ? '★' : '☆'}</button>
          <button class="btn-danger" onclick="deleteExercise(${index})">Remove</button>
        </div>
      </div>
    `).join('');
  }

  function toggleFav(index) {
    exercises[index].favorite = !exercises[index].favorite;
    localStorage.setItem('workout_exercises', JSON.stringify(exercises));
    renderExerciseManager();
    populateExerciseDropdown();
  }

  function deleteExercise(index) {
    if (confirm(`Remove preset for "${exercises[index].name}"?`)) {
      exercises.splice(index, 1);
      localStorage.setItem('workout_exercises', JSON.stringify(exercises));
      renderExerciseManager();
      populateExerciseDropdown();
    }
  }

  // Progress Charting (Chart.js)
  function setupChartFilter() {
    const filterSelect = document.getElementById('chart-filter');
    filterSelect.innerHTML = '<option value="ALL">All Exercises (Total Volume)</option>';
    
    const uniqueExercises = [...new Set(logs.map(l => l.exercise))];
    uniqueExercises.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      filterSelect.appendChild(opt);
    });
  }

  document.getElementById('chart-filter').addEventListener('change', updateChart);

  function updateChart() {
    setupChartFilter();
    const filter = document.getElementById('chart-filter').value;
    const ctx = document.getElementById('volumeChart').getContext('2d');

    const filteredLogs = filter === 'ALL' 
      ? [...logs] 
      : logs.filter(l => l.exercise === filter);

    // Group logs by Date (PST)
    const sorted = filteredLogs.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    
    const dates = [];
    const volumes = [];

    sorted.forEach(log => {
      const d = new Date(log.timestamp).toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles', month: 'numeric', day: 'numeric' });
      const idx = dates.indexOf(d);
      if (idx > -1) {
        volumes[idx] += (log.volume || (log.sets * log.reps));
      } else {
        dates.push(d);
        volumes.push(log.volume || (log.sets * log.reps));
      }
    });

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dates,
        datasets: [{
          label: filter === 'ALL' ? 'Total Volume (lbs / reps)' : `${filter} Volume`,
          data: volumes,
          backgroundColor: '#3b82f6',
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: '#374151' },
            ticks: { color: '#9ca3af' }
          },
          x: {
            grid: { color: '#374151' },
            ticks: { color: '#9ca3af' }
          }
        },
        plugins: {
          legend: { labels: { color: '#f3f4f6' } }
        }
      }
    });
  }

  // Initial Startup
  populateExerciseDropdown();
</script>
</body>
</html>
