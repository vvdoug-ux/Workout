<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workout Tracker</title>
    <!-- We load Chart.js to handle the visual progress graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background: #f4f4f9; 
            color: #333; 
        }
        
        /* Top Navigation Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
            height: 42px; /* Fixed height for header buttons */
        }
        
        .tab-btn {
            flex: 1;
            height: 100%;
            padding: 0 6px;
            background: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .tab-btn:hover { background: #cbd5e1; }
        .tab-btn.active { background: #2563eb; color: white; }

        /* Square Settings Wheel Button */
        .settings-tab-btn {
            flex: none;
            width: 42px; /* Same width as height */
            font-size: 1.1em;
            padding: 0;
        }

        /* Section Visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
        }
        h2, h3 { margin-top: 0; color: #1a1a1a; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        
        input, select, button { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }

        /* Favorite Star Button */
        .star-btn {
            background: transparent;
            color: #cbd5e1; /* Light gray star by default */
            border: none;
            padding: 6px;
            border-radius: 4px;
            font-size: 1.2em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 0;
            width: auto;
            font-weight: bold;
            transition: color 0.2s;
        }
        .star-btn:hover {
            color: #94a3b8;
        }
        .star-btn.active {
            background: transparent;
            color: #eab308; /* Yellow star when active */
        }
        .star-btn.active:hover {
            color: #ca8a04;
        }

        /* Favorites Quick Selection Section */
        .favorites-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .fav-btn {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            width: auto;
            margin-top: 0;
        }
        .fav-btn:hover { background: #e2e8f0; border-color: #94a3b8; }
        
        /* Faded state for exercises already logged today */
        .fav-btn.logged {
            opacity: 0.45;
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        /* Settings Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            max-width: 550px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .modal-header h2 { margin: 0; }
        .close-modal-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            width: auto;
            margin: 0;
            padding: 0 5px;
        }

        /* Add Exercise Container in Settings */
        .add-exercise-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .setting-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fafafa;
        }
        .setting-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .category-chip {
            font-size: 0.8em;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background: white;
            cursor: pointer;
            user-select: none;
            color: #475569;
        }
        .category-chip.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 0;
            width: auto;
            font-weight: bold;
        }
        .delete-btn:hover { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
        canvas { max-width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div class="top-header">
        <button class="tab-btn active" onclick="switchTab('log')">Log Exercise</button>
        <button class="tab-btn" onclick="switchTab('tracker')">Progress</button>
        <button class="tab-btn" onclick="switchTab('history')">History</button>
        <button class="tab-btn settings-tab-btn" onclick="openSettings()" title="Settings">⚙️</button>
    </div>

    <!-- Log Exercise Section -->
    <div id="section-log" class="tab-content active">
        <div class="card">
            <h2>Log Exercise</h2>
            <form id="workout-form">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Exercise Name</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" id="exercise" list="exercise-history" placeholder="Type or select an exercise..." autocomplete="off" onfocus="this.select()" required>
                        <button type="button" id="star-btn" class="star-btn" onclick="toggleFavoriteFromForm()" title="Favorite Exercise">★</button>
                    </div>
                    <datalist id="exercise-history"></datalist>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Weight</label>
                        <input type="number" id="weight" step="0.5" onfocus="this.select()" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Sets</label>
                        <input type="number" id="sets" onfocus="this.select()" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Reps</label>
                        <input type="number" id="reps" onfocus="this.select()" required>
                    </div>
                </div>
                <button type="submit">Save</button>
            </form>
        </div>

        <!-- Favorites Quick Select Card -->
        <div class="card">
            <h2>Favorites</h2>
            <div id="favorites-list"></div>
        </div>
    </div>

    <!-- Chart Visualization Tab -->
    <div id="section-tracker" class="card tab-content">
        <h2>Progress Tracker</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
            <div style="flex: 1; min-width: 160px;">
                <label for="chart-filter">Exercise</label>
                <select id="chart-filter">
                    <option value="">-- No Data Yet --</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 160px;">
                <label for="chart-timeframe">Timeframe</label>
                <select id="chart-timeframe">
                    <option value="week">Week</option>
                    <option value="month">Month</option>
                    <option value="year" selected>Year</option>
                    <option value="max">Max</option>
                </select>
            </div>
        </div>
        <canvas id="progressChart"></canvas>
    </div>

    <!-- History Table Tab -->
    <div id="section-history" class="card tab-content">
        <h2>History</h2>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Exercise</th>
                    <th>Weight</th>
                    <th>Sets</th>
                    <th>Reps</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Exercise Settings</h2>
                <button class="close-modal-btn" onclick="closeSettings()">&times;</button>
            </div>

            <!-- Add New Exercise Input Form -->
            <div class="add-exercise-box">
                <label style="font-weight: bold; font-size: 0.9em; margin-bottom: 6px; display: block;">Add New Exercise</label>
                <form id="add-exercise-form" onsubmit="addNewExerciseFromSettings(event)" style="display: flex; gap: 8px;">
                    <input type="text" id="new-exercise-input" placeholder="Enter exercise name..." style="flex: 1;" required>
                    <button type="submit" style="width: auto; margin-top: 0; padding: 0 16px; font-size: 0.9em; white-space: nowrap;">+ Add</button>
                </form>
            </div>

            <div id="settings-exercise-list"></div>
        </div>
    </div>

    <script>
        // Helper function to get current date in Pacific Time (America/Los_Angeles)
        function getPacificDateString() {
            return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
        }

        // Helper function to calculate start date threshold based on timeframe option
        function getCutoffDateString(timeframe) {
            if (timeframe === 'max') return null;
            
            const d = new Date();
            if (timeframe === 'week') {
                d.setDate(d.getDate() - 7);
            } else if (timeframe === 'month') {
                d.setMonth(d.getMonth() - 1);
            } else if (timeframe === 'year') {
                d.setFullYear(d.getFullYear() - 1);
            }
            return d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
        }

        // Equipment Options
        const EQUIPMENT = [
            "Bodyweight", "Barbell", "Dumbbells", "Kettlebell", "Weight Plate", 
            "Resistance Band", "Medicine Ball", "Weighted Vest", "Wrist Weight", "Ankle Weight"
        ];

        // Muscle Groups Options
        const MUSCLE_GROUPS = [
            "Upper Body", "Lower Body", "Core", "Push", "Pull", 
            "Chest", "Back", "Shoulders", "Arms", "Legs"
        ];

        // Muscles (general) Options
        const MUSCLES_GENERAL = [
            "Biceps", "Triceps", "Forearms", "Quads", "Hamstrings", 
            "Glutes", "Calves", "Lats", "Traps", "Rhomboids", 
            "Pecs", "Delts", "Lower Back", "Abs", "Obliques",
            "Hip Flexors", "Rotator Cuffs"
        ];

        // Muscles (specific) Options
        const MUSCLES_SPECIFIC = [
            "Biceps Brachii (long)", "Biceps Brachii (short)", "Triceps Brachii (long)", "Triceps Brachii (lateral)", "Triceps Brachii (medial)", 
            "Brachialis", "Coracobrachialis", "Anconeus", "Brachioradialis", "Forearm Flexors", "Forearm Extensors", 
            "Rectus Femoris", "Vastus Lateralis", "Vastus Medialis", "Vastus Intermedius", "Adductors", "Abductors", 
            "Gluteus Maximus", "Gluteus Medius", "Gluteus Minimus", 
            "Pectoralis Minor", "Serratus Anterior", "Pectoralis Major (upper)", "Pectoralis Major (middle)", "Pectoralis Major (lower)", 
            "Deltoid (anterior)", "Deltoid (lateral)", "Deltoid (posterior)", 
            "Supraspinatus", "Infraspinatus", "Teres (minor)", "Subscapularis", "Teres (major)", "Latissimus Dorsi", "Levator Scapulae", 
            "Serratus Posterior (superior)", "Serratus Posterior (inferior)", "Rhomboids (major)", "Rhomboids (minor)", 
            "Trapezius (upper)", "Trapezius (middle)", "Trapezius (lower)", 
            "Erector Spinae", "Multifidus", "Quadratus Lumborum", 
            "Rectus Abdominus", "Transversus Abdominus", "Obliques (internal)", "Obliques (external)", 
            "Psoas (major)", "Iliacus", "Sartorius", 
            "Soleus", "Gastrocnemius"
        ];

        // Load existing data from browser storage
        let workouts = JSON.parse(localStorage.getItem('workouts')) || [];
        let exerciseMeta = JSON.parse(localStorage.getItem('exerciseMeta')) || {};

        // Ensure every existing item has a unique ID for deletion & sorting
        workouts = workouts.map(w => w.id ? w : { ...w, id: Date.now() + Math.random() });
        localStorage.setItem('workouts', JSON.stringify(workouts));

        let chartInstance = null;

        const form = document.getElementById('workout-form');
        const filter = document.getElementById('chart-filter');
        const timeframeFilter = document.getElementById('chart-timeframe');
        const datalist = document.getElementById('exercise-history');
        const exerciseInput = document.getElementById('exercise');
        const weightInput = document.getElementById('weight');
        const starBtn = document.getElementById('star-btn');

        // Default date set to Pacific Time
        document.getElementById('date').value = getPacificDateString();

        // Resets all form fields in the Log Exercise section
        function resetLogForm() {
            form.reset();
            document.getElementById('date').value = getPacificDateString();
            updateStarButton();
            updateWeightFieldState();
        }

        // Read metadata without creating a new entry automatically
        function getMeta(exName) {
            if (!exName) return { favorite: false, equipment: [], muscleGroups: [], musclesGeneral: [], musclesSpecific: [] };
            const key = Object.keys(exerciseMeta).find(k => k.toLowerCase() === exName.toLowerCase());
            if (key) {
                const m = exerciseMeta[key];
                return {
                    favorite: !!m.favorite,
                    equipment: m.equipment || [],
                    muscleGroups: m.muscleGroups || [],
                    musclesGeneral: m.musclesGeneral || m.muscles || [],
                    musclesSpecific: m.musclesSpecific || []
                };
            }
            return { favorite: false, equipment: [], muscleGroups: [], musclesGeneral: [], musclesSpecific: [] };
        }

        // Explicitly create/get metadata only when saving
        function ensureMeta(exName) {
            if (!exName) return null;
            const key = Object.keys(exerciseMeta).find(k => k.toLowerCase() === exName.toLowerCase());
            if (key) {
                if (!exerciseMeta[key].equipment) exerciseMeta[key].equipment = [];
                if (!exerciseMeta[key].muscleGroups) exerciseMeta[key].muscleGroups = [];
                if (!exerciseMeta[key].musclesGeneral) exerciseMeta[key].musclesGeneral = exerciseMeta[key].muscles || [];
                if (!exerciseMeta[key].musclesSpecific) exerciseMeta[key].musclesSpecific = [];
                return exerciseMeta[key];
            }
            exerciseMeta[exName] = { favorite: false, equipment: [], muscleGroups: [], musclesGeneral: [], musclesSpecific: [] };
            saveMeta();
            return exerciseMeta[exName];
        }

        function saveMeta() {
            localStorage.setItem('exerciseMeta', JSON.stringify(exerciseMeta));
        }

        // Switch between tabs
        function switchTab(tabName) {
            if (tabName !== 'log') {
                resetLogForm();
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.top-header .tab-btn:not(.settings-tab-btn)').forEach(el => el.classList.remove('active'));

            const buttons = document.querySelectorAll('.top-header .tab-btn');

            if (tabName === 'log') {
                document.getElementById('section-log').classList.add('active');
                buttons[0].classList.add('active');
            } else if (tabName === 'tracker') {
                document.getElementById('section-tracker').classList.add('active');
                buttons[1].classList.add('active');
                updateChart();
            } else if (tabName === 'history') {
                document.getElementById('section-history').classList.add('active');
                buttons[2].classList.add('active');
            }
        }

        // Autofill Weight, Sets, and Reps from the most recent entry
        function autofillExerciseData(exName) {
            if (!exName) return;
            const matching = workouts.filter(w => w.exercise.toLowerCase() === exName.toLowerCase());
            
            if (matching.length > 0) {
                const newest = matching.sort((a, b) => (b.id || 0) - (a.id || 0))[0];
                if (newest) {
                    weightInput.value = newest.weight;
                    document.getElementById('sets').value = newest.sets ? newest.sets : '';
                    document.getElementById('reps').value = newest.reps;
                }
            }
        }

        // Check if current exercise uses Bodyweight equipment and toggle Weight field disabled state accordingly
        function updateWeightFieldState() {
            const val = exerciseInput.value.trim();
            const meta = getMeta(val);

            if (val && meta.equipment && meta.equipment.includes("Bodyweight")) {
                weightInput.disabled = true;
                weightInput.value = '0';
                weightInput.required = false;
                weightInput.style.backgroundColor = '#e2e8f0';
                weightInput.style.color = '#94a3b8';
                weightInput.style.cursor = 'not-allowed';
            } else {
                weightInput.disabled = false;
                weightInput.required = true;
                weightInput.style.backgroundColor = '';
                weightInput.style.color = '';
                weightInput.style.cursor = '';
            }
        }

        // Update star favorite button state next to exercise input
        function updateStarButton() {
            const val = exerciseInput.value.trim();
            starBtn.textContent = '★';

            if (!val) {
                starBtn.classList.remove('active');
                return;
            }

            const meta = getMeta(val);
            if (meta.favorite) {
                starBtn.classList.add('active');
            } else {
                starBtn.classList.remove('active');
            }
        }

        function toggleFavoriteFromForm() {
            const val = exerciseInput.value.trim();
            if (!val) return;
            
            const meta = ensureMeta(val);
            meta.favorite = !meta.favorite;
            saveMeta();
            updateStarButton();
            updateUI();
        }

        // Handle exercise input change & clear fields when empty
        exerciseInput.addEventListener('input', () => {
            const val = exerciseInput.value.trim();
            if (val) {
                autofillExerciseData(val);
            } else {
                weightInput.value = '';
                document.getElementById('sets').value = '';
                document.getElementById('reps').value = '';
            }
            updateStarButton();
            updateWeightFieldState();
        });

        // Handle form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const exercise = exerciseInput.value.trim();
            const weight = weightInput.disabled ? 0 : (parseFloat(weightInput.value) || 0);
            const sets = parseInt(document.getElementById('sets').value);
            const reps = parseInt(document.getElementById('reps').value);

            ensureMeta(exercise);

            const newEntry = { id: Date.now(), date, exercise, weight, sets, reps };
            workouts.push(newEntry);
            localStorage.setItem('workouts', JSON.stringify(workouts));
            
            updateUI();
            resetLogForm();
        });

        filter.addEventListener('change', updateChart);
        timeframeFilter.addEventListener('change', updateChart);

        function deleteEntry(id) {
            if (confirm("Are you sure you want to delete this set?")) {
                workouts = workouts.filter(w => w.id !== id);
                localStorage.setItem('workouts', JSON.stringify(workouts));
                updateUI();
            }
        }

        // Select Favorite & Smooth Scroll to Top
        function selectFavorite(exName) {
            exerciseInput.value = exName;
            autofillExerciseData(exName);
            updateStarButton();
            updateWeightFieldState();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateFavoritesList() {
            const container = document.getElementById('favorites-list');
            container.innerHTML = '';
            
            const favExercises = Object.keys(exerciseMeta).filter(k => exerciseMeta[k].favorite);
            
            if (favExercises.length === 0) {
                container.innerHTML = '<p style="color: #64748b; font-size: 0.9em; margin: 0;">No favorites added yet. Click the star ★ next to an exercise to favorite it!</p>';
                return;
            }

            const todayStr = getPacificDateString();

            // Map favorites by Muscle Group
            const categorizedFavs = {};
            MUSCLE_GROUPS.forEach(mg => categorizedFavs[mg] = []);
            categorizedFavs["Uncategorized"] = [];

            favExercises.forEach(ex => {
                const meta = getMeta(ex);
                const activeFavGroups = (meta.muscleGroups || []).filter(mg => MUSCLE_GROUPS.includes(mg));

                if (activeFavGroups.length > 0) {
                    [...new Set(activeFavGroups)].forEach(mg => {
                        categorizedFavs[mg].push(ex);
                    });
                } else {
                    categorizedFavs["Uncategorized"].push(ex);
                }
            });

            const allCatKeys = [...MUSCLE_GROUPS, "Uncategorized"];

            allCatKeys.forEach(mg => {
                const exercisesInCat = categorizedFavs[mg];
                if (exercisesInCat && exercisesInCat.length > 0) {
                    exercisesInCat.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
                    const uniqueEx = [...new Set(exercisesInCat)];

                    const groupDiv = document.createElement('div');
                    groupDiv.style.marginBottom = '14px';

                    const catHeader = document.createElement('div');
                    catHeader.textContent = mg;
                    catHeader.style.fontSize = '0.8em';
                    catHeader.style.fontWeight = 'bold';
                    catHeader.style.color = '#64748b';
                    catHeader.style.textTransform = 'uppercase';
                    catHeader.style.letterSpacing = '0.5px';
                    catHeader.style.marginBottom = '6px';

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'favorites-grid';

                    uniqueEx.forEach(ex => {
                        const btn = document.createElement('button');
                        btn.className = 'fav-btn';
                        btn.type = 'button';
                        btn.textContent = ex;

                        const isLoggedToday = workouts.some(w => 
                            w.exercise.toLowerCase() === ex.toLowerCase() && w.date === todayStr
                        );

                        if (isLoggedToday) {
                            btn.classList.add('logged');
                            btn.title = 'Already logged today';
                        }

                        btn.onclick = () => selectFavorite(ex);
                        gridDiv.appendChild(btn);
                    });

                    groupDiv.appendChild(catHeader);
                    groupDiv.appendChild(gridDiv);
                    container.appendChild(groupDiv);
                }
            });
        }

        function updateUI() {
            updateTable();
            updateExerciseLists();
            updateFavoritesList();
            updateChart();
        }

        // Render History Table (Most recently added entry appears first)
        function updateTable() {
            const tbody = document.querySelector('#history-table tbody');
            tbody.innerHTML = '';
            
            const sorted = [...workouts].sort((a, b) => (b.id || 0) - (a.id || 0));
            
            sorted.forEach(w => {
                const tr = document.createElement('tr');
                const displaySets = w.sets ? w.sets : '-';
                
                tr.innerHTML = `
                    <td>${w.date}</td>
                    <td>${w.exercise}</td>
                    <td>${w.weight}</td>
                    <td>${displaySets}</td>
                    <td>${w.reps}</td>
                    <td><button class="delete-btn" onclick="deleteEntry(${w.id})">X</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateExerciseLists() {
            const exercises = [...new Set([
                ...workouts.map(w => w.exercise),
                ...Object.keys(exerciseMeta)
            ])].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
            
            const currentSelection = filter.value;
            filter.innerHTML = '<option value="">-- Select Exercise --</option>';
            datalist.innerHTML = '';

            if (exercises.length === 0) return;

            exercises.forEach(ex => {
                const option = document.createElement('option');
                option.value = ex;
                option.textContent = ex;
                if (ex === currentSelection) option.selected = true;
                filter.appendChild(option);

                const dataOption = document.createElement('option');
                dataOption.value = ex;
                datalist.appendChild(dataOption);
            });

            if (!filter.value && exercises.length > 0) {
                filter.value = exercises[0];
            }
        }

        function updateChart() {
            const selectedEx = filter.value;
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            if (!selectedEx || workouts.length === 0) return;

            let data = workouts.filter(w => w.exercise === selectedEx);

            if (data.length === 0) return;

            const selectedTimeframe = timeframeFilter.value;
            const cutoffDate = getCutoffDateString(selectedTimeframe);

            if (cutoffDate) {
                data = data.filter(w => w.date >= cutoffDate);
            }

            if (data.length === 0) return;

            const meta = getMeta(selectedEx);
            const isBodyweight = meta.equipment && meta.equipment.includes("Bodyweight");

            const dateTotals = {};
            data.forEach(w => {
                const numSets = w.sets ? w.sets : 1;
                const volume = isBodyweight ? (numSets * w.reps) : (w.weight * numSets * w.reps);
                
                if (dateTotals[w.date]) {
                    dateTotals[w.date] += volume;
                } else {
                    dateTotals[w.date] = volume;
                }
            });

            const dates = Object.keys(dateTotals).sort((a, b) => new Date(a) - new Date(b));
            const totalVolumes = dates.map(d => dateTotals[d]);

            const yAxisLabel = isBodyweight ? 'Total Volume' : 'Total Weight';

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [{
                        data: totalVolumes,
                        backgroundColor: 'rgba(37, 99, 235, 0.75)',
                        borderColor: '#2563eb',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return isBodyweight 
                                        ? `Total Volume: ${context.parsed.y} reps` 
                                        : `Total Weight: ${context.parsed.y} lbs/kg`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: { 
                            beginAtZero: true,
                            title: { display: true, text: yAxisLabel },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        /* --- Settings Modal Logic --- */
        function openSettings() {
            resetLogForm();
            renderSettingsList();
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function addNewExerciseFromSettings(e) {
            e.preventDefault();
            const input = document.getElementById('new-exercise-input');
            const exName = input.value.trim();

            if (exName) {
                ensureMeta(exName);
                input.value = '';
                updateUI();
                renderSettingsList();
            }
        }

        function renderSettingsList() {
            const container = document.getElementById('settings-exercise-list');
            container.innerHTML = '';

            const allExercises = [...new Set([
                ...workouts.map(w => w.exercise),
                ...Object.keys(exerciseMeta)
            ])].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

            if (allExercises.length === 0) {
                container.innerHTML = '<p style="color: #64748b;">No exercises added yet.</p>';
                return;
            }

            allExercises.forEach(ex => {
                const meta = ensureMeta(ex);

                const item = document.createElement('div');
                item.className = 'setting-item';

                const topRow = document.createElement('div');
                topRow.className = 'setting-row';

                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = ex;
                nameInput.style.flex = '1';
                nameInput.onfocus = function() { this.select(); };
                nameInput.onchange = () => {
                    const newName = nameInput.value.trim();
                    if (newName && newName !== ex) {
                        renameExercise(ex, newName);
                    }
                };

                const favBtn = document.createElement('button');
                favBtn.className = 'star-btn' + (meta.favorite ? ' active' : '');
                favBtn.textContent = '★';
                favBtn.type = 'button';
                favBtn.onclick = () => {
                    meta.favorite = !meta.favorite;
                    saveMeta();
                    renderSettingsList();
                    updateFavoritesList();
                    updateStarButton();
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'X';
                deleteBtn.type = 'button';
                deleteBtn.title = 'Delete Exercise';
                deleteBtn.onclick = () => {
                    if (confirm(`Are you sure you want to delete "${ex}" and all its history?`)) {
                        deleteExercise(ex);
                    }
                };

                topRow.appendChild(nameInput);
                topRow.appendChild(favBtn);
                topRow.appendChild(deleteBtn);
                item.appendChild(topRow);

                // 1. Equipment Selection Chips
                const equipLabel = document.createElement('label');
                equipLabel.textContent = 'Equipment:';
                equipLabel.style.marginTop = '6px';

                const equipChipsDiv = document.createElement('div');
                equipChipsDiv.className = 'category-chips';

                EQUIPMENT.forEach(itemOpt => {
                    const chip = document.createElement('div');
                    const isSelected = meta.equipment.includes(itemOpt);
                    chip.className = 'category-chip' + (isSelected ? ' selected' : '');
                    chip.textContent = itemOpt;
                    chip.onclick = () => {
                        if (isSelected) {
                            meta.equipment = meta.equipment.filter(e => e !== itemOpt);
                        } else {
                            meta.equipment.push(itemOpt);
                        }
                        saveMeta();
                        renderSettingsList();
                        updateFavoritesList();
                        updateWeightFieldState();
                    };
                    equipChipsDiv.appendChild(chip);
                });

                item.appendChild(equipLabel);
                item.appendChild(equipChipsDiv);

                // 2. Muscle Groups Selection Chips
                const mgLabel = document.createElement('label');
                mgLabel.textContent = 'Muscle Groups:';
                mgLabel.style.marginTop = '10px';

                const mgChipsDiv = document.createElement('div');
                mgChipsDiv.className = 'category-chips';

                MUSCLE_GROUPS.forEach(itemOpt => {
                    const chip = document.createElement('div');
                    const isSelected = meta.muscleGroups.includes(itemOpt);
                    chip.className = 'category-chip' + (isSelected ? ' selected' : '');
                    chip.textContent = itemOpt;
                    chip.onclick = () => {
                        if (isSelected) {
                            meta.muscleGroups = meta.muscleGroups.filter(mg => mg !== itemOpt);
                        } else {
                            meta.muscleGroups.push(itemOpt);
                        }
                        saveMeta();
                        renderSettingsList();
                        updateFavoritesList();
                    };
                    mgChipsDiv.appendChild(chip);
                });

                item.appendChild(mgLabel);
                item.appendChild(mgChipsDiv);

                // 3. Muscles (general) Selection Chips
                const mgGenLabel = document.createElement('label');
                mgGenLabel.textContent = 'Muscles (general):';
                mgGenLabel.style.marginTop = '10px';

                const mgGenChipsDiv = document.createElement('div');
                mgGenChipsDiv.className = 'category-chips';

                MUSCLES_GENERAL.forEach(itemOpt => {
                    const chip = document.createElement('div');
                    const isSelected = meta.musclesGeneral.includes(itemOpt);
                    chip.className = 'category-chip' + (isSelected ? ' selected' : '');
                    chip.textContent = itemOpt;
                    chip.onclick = () => {
                        if (isSelected) {
                            meta.musclesGeneral = meta.musclesGeneral.filter(m => m !== itemOpt);
                        } else {
                            meta.musclesGeneral.push(itemOpt);
                        }
                        saveMeta();
                        renderSettingsList();
                    };
                    mgGenChipsDiv.appendChild(chip);
                });

                item.appendChild(mgGenLabel);
                item.appendChild(mgGenChipsDiv);

                // 4. Muscles (specific) Selection Chips
                const mgSpecLabel = document.createElement('label');
                mgSpecLabel.textContent = 'Muscles (specific):';
                mgSpecLabel.style.marginTop = '10px';

                const mgSpecChipsDiv = document.createElement('div');
                mgSpecChipsDiv.className = 'category-chips';

                MUSCLES_SPECIFIC.forEach(itemOpt => {
                    const chip = document.createElement('div');
                    const isSelected = meta.musclesSpecific.includes(itemOpt);
                    chip.className = 'category-chip' + (isSelected ? ' selected' : '');
                    chip.textContent = itemOpt;
                    chip.onclick = () => {
                        if (isSelected) {
                            meta.musclesSpecific = meta.musclesSpecific.filter(m => m !== itemOpt);
                        } else {
                            meta.musclesSpecific.push(itemOpt);
                        }
                        saveMeta();
                        renderSettingsList();
                    };
                    mgSpecChipsDiv.appendChild(chip);
                });

                item.appendChild(mgSpecLabel);
                item.appendChild(mgSpecChipsDiv);

                container.appendChild(item);
            });
        }

        function renameExercise(oldName, newName) {
            workouts.forEach(w => {
                if (w.exercise.toLowerCase() === oldName.toLowerCase()) {
                    w.exercise = newName;
                }
            });
            localStorage.setItem('workouts', JSON.stringify(workouts));

            const key = Object.keys(exerciseMeta).find(k => k.toLowerCase() === oldName.toLowerCase());
            if (key) {
                exerciseMeta[newName] = exerciseMeta[key];
                if (key !== newName) delete exerciseMeta[key];
            } else {
                exerciseMeta[newName] = { favorite: false, equipment: [], muscleGroups: [], musclesGeneral: [], musclesSpecific: [] };
            }
            saveMeta();

            updateUI();
            renderSettingsList();
        }

        function deleteExercise(exName) {
            workouts = workouts.filter(w => w.exercise.toLowerCase() !== exName.toLowerCase());
            localStorage.setItem('workouts', JSON.stringify(workouts));

            const key = Object.keys(exerciseMeta).find(k => k.toLowerCase() === exName.toLowerCase());
            if (key) {
                delete exerciseMeta[key];
                saveMeta();
            }

            updateUI();
            renderSettingsList();
        }

        // Initialize app on page load
        updateUI();
    </script>
</body>
</html>
